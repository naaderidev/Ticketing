name: Legacy Retirement Approval

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Full lowercase application release commit SHA
        required: true
        type: string
      go_live_evidence_revision:
        description: Full lowercase Go-Live evidence commit SHA
        required: true
        type: string
      closure_revision:
        description: Full lowercase release closure commit SHA
        required: true
        type: string
      retirement_revision:
        description: Full lowercase descendant commit SHA containing retirement evidence
        required: true
        type: string
      go_live_evidence_path:
        description: Release-specific Go-Live evidence path
        required: true
        type: string
      closure_evidence_path:
        description: Release-specific closure evidence path
        required: true
        type: string
      retirement_evidence_path:
        description: Release-specific Legacy retirement evidence path
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: legacy-retirement-${{ inputs.release_id }}
  cancel-in-progress: false

jobs:
  approve:
    name: Validate Legacy retirement readiness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: legacy-retirement-approval
    env:
      EXPECTED_RELEASE_ID: ${{ inputs.release_id }}
      EXPECTED_SOURCE_REVISION: ${{ inputs.release_id }}
      DEPLOYMENT_VERSION: ${{ inputs.release_id }}
      EXPECTED_GO_LIVE_EVIDENCE_REVISION: ${{ inputs.go_live_evidence_revision }}
      EXPECTED_CLOSURE_REVISION: ${{ inputs.closure_revision }}
      RETIREMENT_REVISION: ${{ inputs.retirement_revision }}
      GO_LIVE_EVIDENCE_PATH: ${{ inputs.go_live_evidence_path }}
      RELEASE_CLOSURE_EVIDENCE_PATH: ${{ inputs.closure_evidence_path }}
      LEGACY_RETIREMENT_EVIDENCE_PATH: ${{ inputs.retirement_evidence_path }}

    steps:
      - name: Validate immutable revision inputs
        shell: bash
        run: |
          [[ "${EXPECTED_RELEASE_ID}" =~ ^[a-f0-9]{40}$ ]]
          [[ "${EXPECTED_GO_LIVE_EVIDENCE_REVISION}" =~ ^[a-f0-9]{40}$ ]]
          [[ "${EXPECTED_CLOSURE_REVISION}" =~ ^[a-f0-9]{40}$ ]]
          [[ "${RETIREMENT_REVISION}" =~ ^[a-f0-9]{40}$ ]]
          test "${EXPECTED_RELEASE_ID}" != "${EXPECTED_GO_LIVE_EVIDENCE_REVISION}"
          test "${EXPECTED_GO_LIVE_EVIDENCE_REVISION}" != "${EXPECTED_CLOSURE_REVISION}"
          test "${EXPECTED_CLOSURE_REVISION}" != "${RETIREMENT_REVISION}"

      - name: Checkout exact retirement evidence revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.retirement_revision }}
          fetch-depth: 0

      - name: Checkout exact application release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_id }}
          path: .release-source

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .release-source/.nvmrc

      - name: Verify immutable retirement evidence chain
        shell: bash
        run: |
          test "$(git -C .release-source rev-parse HEAD)" = "${EXPECTED_RELEASE_ID}"
          test "$(git rev-parse HEAD)" = "${RETIREMENT_REVISION}"
          git merge-base --is-ancestor "${EXPECTED_RELEASE_ID}" "${EXPECTED_GO_LIVE_EVIDENCE_REVISION}"
          git merge-base --is-ancestor "${EXPECTED_GO_LIVE_EVIDENCE_REVISION}" "${EXPECTED_CLOSURE_REVISION}"
          git merge-base --is-ancestor "${EXPECTED_CLOSURE_REVISION}" "${RETIREMENT_REVISION}"

      - name: Revalidate application release contract
        working-directory: .release-source
        run: node scripts/check-release-readiness.mjs --require-release-id

      - name: Revalidate approved Go-Live evidence
        run: >-
          node .release-source/scripts/check-go-live-readiness.mjs
          --output go-live-readiness.json

      - name: Revalidate approved release closure
        run: >-
          node .release-source/scripts/check-release-closure.mjs
          --output release-closure-readiness.json

      - name: Validate Legacy retirement evidence without deleting anything
        run: >-
          node .release-source/scripts/check-legacy-retirement.mjs
          --output legacy-retirement-readiness.json

      - name: Upload immutable retirement decision
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: legacy-retirement-${{ inputs.release_id }}
          path: |
            go-live-readiness.json
            release-closure-readiness.json
            legacy-retirement-readiness.json
          if-no-files-found: error
          retention-days: 365
