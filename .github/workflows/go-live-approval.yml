name: Go-Live Evidence Approval

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Full lowercase Git commit SHA approved for production
        required: true
        type: string
      evidence_revision:
        description: Full lowercase Git commit SHA containing the reviewed evidence package
        required: true
        type: string
      evidence_path:
        description: Release-specific evidence path, for example release-evidence/<sha>.json
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: go-live-${{ inputs.release_id }}
  cancel-in-progress: false

jobs:
  approve:
    name: Validate production Go-Live evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-approval
    env:
      EXPECTED_RELEASE_ID: ${{ inputs.release_id }}
      EVIDENCE_REVISION: ${{ inputs.evidence_revision }}
      GO_LIVE_EVIDENCE_PATH: ${{ inputs.evidence_path }}
      DEPLOYMENT_VERSION: ${{ inputs.release_id }}
      EXPECTED_SOURCE_REVISION: ${{ inputs.release_id }}

    steps:
      - name: Validate immutable revision inputs
        shell: bash
        run: |
          [[ "${EXPECTED_RELEASE_ID}" =~ ^[a-f0-9]{40}$ ]]
          [[ "${EVIDENCE_REVISION}" =~ ^[a-f0-9]{40}$ ]]

      - name: Checkout the exact evidence revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.evidence_revision }}
          fetch-depth: 0

      - name: Checkout the exact release candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_id }}
          path: .release-source

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .release-source/.nvmrc

      - name: Verify release and evidence ancestry
        shell: bash
        run: |
          test "$(git -C .release-source rev-parse HEAD)" = "${EXPECTED_RELEASE_ID}"
          test "$(git rev-parse HEAD)" = "${EVIDENCE_REVISION}"
          git merge-base --is-ancestor "${EXPECTED_RELEASE_ID}" "${EVIDENCE_REVISION}"

      - name: Revalidate repository release contract
        working-directory: .release-source
        run: node scripts/check-release-readiness.mjs --require-release-id

      - name: Validate Go-Live evidence without deploying
        run: node .release-source/scripts/check-go-live-readiness.mjs --output go-live-readiness.json

      - name: Upload immutable Go-Live decision evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-live-readiness-${{ inputs.release_id }}
          path: go-live-readiness.json
          if-no-files-found: error
          retention-days: 90
